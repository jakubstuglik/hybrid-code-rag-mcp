version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: informica_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant/index_bge_m3_qdrant:/var/lib/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
