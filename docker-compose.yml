## Docker Compose (Legacy)
##
## This file is no longer used by the default workflow.
## Docker containers are now managed by shared/docker_utils.py
## (auto-started via index_rag.py / rag_mcp.py / start_qdrant.bat).
##
## Kept as a reference and manual alternative:
##   set BASE_PATH=qdrant
##   set MODEL_PATH=index_jinaai_my_project
##   set QDRANT_PORT=6333
##   docker compose up -d

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: code_rag_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - "${BASE_PATH}/${MODEL_PATH}:/var/lib/qdrant"
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/var/lib/qdrant
      - QDRANT__LOG_LEVEL=INFO
    command: ["/bin/bash", "-c", "sleep 2 && /qdrant/entrypoint.sh"]
    restart: on-failure
