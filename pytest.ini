[pytest]
testpaths = src_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests (fast, no external deps)

[coverage:run]
source = shared
omit =
    src_test/*
    .venv/*

[coverage:report]
show_missing = true
precision = 1
